# يربط صور الأدوية (data/catalog-images) بكتالوج قاعدة الإنتاج: يرفع كل صورة
# مرة واحدة إلى Cloudinary (feniq/catalog) ويحفظ رابطها في imageUrl للصنف.
# الصور لا تُخزَّن في Render (قرصه يُمسح عند النوم) ولا في قاعدة البيانات.
#
# قبل التشغيل، في إعدادات الريبو ← Secrets and variables ← Actions:
#   MONGODB_URI            موجود مسبقاً
#   CLOUDINARY_CLOUD_NAME  نفس القيم الموضوعة في Render
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
# ثم: Actions ← Link catalog images ← Run workflow. شغّله أولاً بتجربة (dry run).
name: Link catalog images

on:
  workflow_dispatch:
    inputs:
      confidence:
        description: 'مستويات المطابقة (exact,brand أو exact,brand,fuzzy)'
        required: true
        default: 'exact,brand'
      dry_run:
        description: 'تجربة فقط بدون كتابة'
        type: boolean
        default: true

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - name: Link the pictures
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CONFIDENCE: ${{ inputs.confidence }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The script loads the server config, which insists on a secret it
          # does not use here; a throwaway value satisfies the check.
          JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-link-images-only-not-used-for-tokens
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$CLOUDINARY_CLOUD_NAME" ] || [ -z "$CLOUDINARY_API_KEY" ] || [ -z "$CLOUDINARY_API_SECRET" ]; then
            echo "::error::Add the MONGODB_URI and CLOUDINARY_* repository secrets first."
            exit 1
          fi
          FLAGS="--confidence=$CONFIDENCE"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          node scripts/link-catalog-images.js ../data/catalog-images $FLAGS
