# يبني تطبيق الصيدليات (APK) تلقائياً مع كل تعديل على phoenix/ في main،
# أو يدوياً من تبويب Actions ← Build Android APK ← Run workflow.
# الملف الناتج: صفحة التشغيل ← Artifacts ← feniq-apk.
#
# التوقيع: من أسرار المستودع ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD
# و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD (المفتاح الدائم — انظر
# phoenix/android/README.md). بدونها يُبنى APK تجريبي بمفتاح مؤقت باسم
# feniq-apk-TEST-ONLY، ولا يُنشر على الموقع أبداً (لا يمكن التحديث فوقه).
#
# التحقق: صفحة كل تشغيل (Summary) تعرض معرّف التطبيق وبصمة SHA-256 لشهادة
# التوقيع. نفس البصمة في كل نسخة = التحديث فوق النسخة السابقة يعمل. إذا وُضع
# متغيّر المستودع ANDROID_CERT_SHA256 (Settings ← Variables) بالبصمة الصحيحة،
# يفشل البناء تلقائياً إذا وُقّع بمفتاح آخر.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-apk.yml'
  # Builds (and tests) every PR that touches the app, so a broken Gradle or
  # Dart change shows up before merge. site-deploy.yml only ever takes APKs
  # from main.
  pull_request:
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'رابط السيرفر (اتركه فارغاً للافتراضي)'
        required: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phoenix
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://feniq-connect-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      # The app pins an NDK the runner doesn't have; Gradle installs it only
      # once the SDK licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in repository secrets - this APK is signed with a temporary debug key, uploaded as feniq-apk-TEST-ONLY and never published. See phoenix/android/README.md."
            echo "artifact=feniq-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "artifact=feniq-apk" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      # What the owner checks to know an update will install over the previous
      # version: the same application id and the same certificate fingerprint.
      - name: Verify signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ARTIFACT: ${{ steps.signing.outputs.artifact }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          app_id=$("$tools/aapt2" dump packagename "$apk")
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          {
            echo "### APK"
            echo "- artifact: \`$ARTIFACT\`"
            echo "- applicationId: \`$app_id\`"
            echo "- signing certificate SHA-256: \`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "applicationId=$app_id"
          echo "certificate SHA-256=$cert"
          if [ "$ARTIFACT" = "feniq-apk" ] && [ -n "$EXPECTED_SHA256" ]; then
            want=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')
            got=$(echo "$cert" | tr -d ':')
            if [ "$want" != "$got" ]; then
              echo "::error::APK signed with a different key than ANDROID_CERT_SHA256 - it would NOT install over the existing app."
              exit 1
            fi
            echo "Fingerprint matches ANDROID_CERT_SHA256."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: phoenix/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
