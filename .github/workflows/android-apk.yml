# يبني تطبيق الصيدليات (APK) يدوياً فقط (من 2026-10-12، بطلب صاحب المشروع):
# تبويب Actions ← Build Android APK ← Run workflow (أو من الكمبيوتر:
# gh workflow run android-apk.yml --ref main). الـ Pull Requests بتنفحص تلقائياً
# بس ما بتبني APK وما بتنشر شي.
# الملف الناتج: صفحة التشغيل ← Artifacts ← feniq-apk.
#
# للتجربة: كل بناء يدوي على main يضع آخر نسختين على روابط ثابتة (أسرع من
# Artifacts، ملف APK مباشر بدون zip):
#   الموبايل (arm64):  https://github.com/feniq-new-account/feniq-link--backend/releases/download/test-latest/feniq-test.apk
#   المحاكي (x86_64): https://github.com/feniq-new-account/feniq-link--backend/releases/download/test-latest/feniq-emulator.apk
#
# التوقيع: من أسرار المستودع ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD
# و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD (المفتاح الدائم — انظر
# phoenix/android/README.md). بدونها يُبنى APK تجريبي بمفتاح مؤقت باسم
# feniq-apk-TEST-ONLY، ولا يُنشر على الموقع أبداً (لا يمكن التحديث فوقه).
#
# التحقق: صفحة كل تشغيل (Summary) تعرض معرّف التطبيق وبصمة SHA-256 لشهادة
# التوقيع. نفس البصمة في كل نسخة = التحديث فوق النسخة السابقة يعمل. إذا وُضع
# متغيّر المستودع ANDROID_CERT_SHA256 (Settings ← Variables) بالبصمة الصحيحة،
# يفشل البناء تلقائياً إذا وُقّع بمفتاح آخر.
name: Build Android APK

on:
  # PRs run Flutter tests only. APK creation requires a manual request.
  # site-deploy.yml only ever takes APKs from main.
  pull_request:
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'رابط السيرفر (اتركه فارغاً للافتراضي)'
        required: false

# contents: write - to put the main build on the fixed "test-latest" release.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    # Ammar: never create an APK automatically; wait for an explicit request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phoenix
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://feniq-connect-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      # The app pins an NDK the runner doesn't have; Gradle installs it only
      # once the SDK licenses are accepted.
      - name: Accept Android SDK licenses
        run: bash android/install-ci-sdk.sh

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in repository secrets - this APK is signed with a temporary debug key, uploaded as feniq-apk-TEST-ONLY and never published. See phoenix/android/README.md."
            echo "artifact=feniq-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A signed staging build must never replace the public production APK.
          if [ "$GITHUB_REF" = refs/heads/main ] && \
             [ "$API_BASE_URL" = 'https://feniq-connect-api.onrender.com/api' ]; then
            if [ -z "$EXPECTED_SHA256" ]; then
              echo "::error::ANDROID_CERT_SHA256 is required for production publication."
              exit 1
            fi
            echo "artifact=feniq-apk" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=feniq-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Version code = run number + 1000: this repo started counting runs at 1 when
      # it moved accounts (2026-10-11), but phones already carry builds up to ~100+
      # from the old repo, and Android refuses to install a lower version code
      # over a higher one ("App not installed").
      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=$((GITHUB_RUN_NUMBER + 1000))
          --dart-define="API_BASE_URL=$API_BASE_URL"

      # What the owner checks to know an update will install over the previous
      # version: the same application id and the same certificate fingerprint.
      - name: Verify signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ARTIFACT: ${{ steps.signing.outputs.artifact }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          app_id=$("$tools/aapt2" dump packagename "$apk")
          # The signer line's label varies by apksigner version and signature
          # scheme ("Signer #1 ...", "Signer (minSdkVersion=...) ..."), so match
          # on the digest label alone and take the first.
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          cert=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -z "$cert" ]; then
            echo "$certs"
            echo "::error::Could not read the signing certificate fingerprint from apksigner."
            exit 1
          fi
          {
            echo "### APK"
            echo "- artifact: \`$ARTIFACT\`"
            echo "- applicationId: \`$app_id\`"
            echo "- signing certificate SHA-256: \`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "applicationId=$app_id"
          echo "certificate SHA-256=$cert"
          if [ "$ARTIFACT" = "feniq-apk" ] && [ -n "$EXPECTED_SHA256" ]; then
            want=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')
            got=$(echo "$cert" | tr -d ':')
            if [ "$want" != "$got" ]; then
              echo "::error::APK signed with a different key than ANDROID_CERT_SHA256 - it would NOT install over the existing app."
              exit 1
            fi
            echo "Fingerprint matches ANDROID_CERT_SHA256."
          fi
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)
          jq -n --arg api "$API_BASE_URL" --arg id "$app_id" --arg cert "$cert" \
            --arg sha "$digest" --arg commit "$GITHUB_SHA" \
            --arg build "$((GITHUB_RUN_NUMBER + 1000))" --arg date "$(date -u +%F)" \
            '{apiBaseUrl:$api, applicationId:$id, certificateSha256:$cert, sha256:$sha, commit:$commit, build:$build, date:$date}' \
            > build/app/outputs/flutter-apk/release.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            phoenix/build/app/outputs/flutter-apk/app-release.apk
            phoenix/build/app/outputs/flutter-apk/release.json
          retention-days: 30

      # The fixed download link for trying the app on a phone: a release asset
      # is served straight as an .apk (no zip) and downloads much faster than
      # an artifact. Built for 64-bit ARM only (every current phone), which
      # halves the size. main only - neither a PR nor a manual run of another
      # branch ever replaces it.
      - name: Build phone APK (arm64)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # The first build's Gradle daemon still holds its 8 GB heap; a second
        # daemon on top of it made the runner run out of memory and shut the
        # job down ("received a shutdown signal"). Stop it first.
        run: |
          (cd android && ./gradlew --stop) || true
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number=$((GITHUB_RUN_NUMBER + 1000)) \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk feniq-test.apk

      # Same app for the Android Studio emulator, which runs x86_64 images and
      # cannot install the arm64-only phone build.
      - name: Build emulator APK (x86_64)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          (cd android && ./gradlew --stop) || true
          flutter build apk --release \
            --target-platform android-x64 \
            --build-number=$((GITHUB_RUN_NUMBER + 1000)) \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk feniq-emulator.apk

      - name: Publish to the test-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="آخر نسخة تجريبية من main (بناء رقم $((GITHUB_RUN_NUMBER + 1000))، ${GITHUB_SHA::7}). feniq-test.apk للموبايل، feniq-emulator.apk للمحاكي. احذف التطبيق القديم قبل التثبيت إذا كانت نسخة تجريبية."
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest feniq-test.apk feniq-emulator.apk --clobber
            gh release edit test-latest --notes "$notes"
          else
            gh release create test-latest feniq-test.apk feniq-emulator.apk --prerelease --title "Feniq - آخر نسخة تجريبية" --notes "$notes" --target "$GITHUB_SHA"
          fi
