# يبني تطبيق الصيدليات (APK) يدوياً فقط (من 2026-10-12، بطلب صاحب المشروع):
# تبويب Actions ← Build Android APK ← Run workflow (أو من الكمبيوتر:
# gh workflow run android-apk.yml --ref main). الـ Pull Requests بتنفحص تلقائياً
# بس ما بتبني APK وما بتنشر شي.
# الملف الناتج: صفحة التشغيل ← Artifacts ← feniq-apk.
# Publication of the fixed test-latest download is a SEPARATE explicit
# workflow_dispatch input (publish_test_release; default false). A manual
# signed test APK build must never replace the existing phone download by itself.
#
# للتجربة: كل بناء يدوي على main يضع آخر نسختين على روابط ثابتة (أسرع من
# Artifacts، ملف APK مباشر بدون zip):
#   الموبايل (نسخة شاملة):  https://github.com/feniq-new-account/feniq-link--backend/releases/download/test-latest/feniq-test.apk
#   المحاكي (x86_64): https://github.com/feniq-new-account/feniq-link--backend/releases/download/test-latest/feniq-emulator.apk
#
# التوقيع: من أسرار المستودع ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD
# و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD (المفتاح الدائم — انظر
# phoenix/android/README.md). بدونها يُبنى APK تجريبي بمفتاح مؤقت باسم
# feniq-apk-TEST-ONLY، ولا يُنشر على الموقع أبداً (لا يمكن التحديث فوقه).
#
# التحقق: صفحة كل تشغيل (Summary) تعرض معرّف التطبيق وبصمة SHA-256 لشهادة
# التوقيع. نفس البصمة مع رقم بناء مناسب يسمح بالتحديث فوق النسخة السابقة.
# البصمة المرجعية محفوظة في .github/android-certificate.sha256؛ يمكن تجاوزها
# بمتغيّر المستودع ANDROID_CERT_SHA256. اختلاف التوقيع يوقف النشر.
name: Build Android APK

on:
  # Task-specific branches for explicitly requested signed launch validation.
  # Ordinary branches/main still require manual dispatch. The November branch
  # is an acceptance build only and cannot publish the production download.
  push:
    branches: [codex/launch-apk-validation-2026-10-31, codex/launch-upgrade-check-2026-10-31, codex/release-acceptance-2026-11-05]
  # PRs run Flutter tests only. APK creation requires a manual request.
  # site-deploy.yml only ever takes APKs from main.
  pull_request:
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: 'Explicitly replace test-latest download only after reviewing this signed main build (default OFF)'
        required: false
        type: boolean
        default: false
      baseline_validation_run:
        description: 'Previous signed APK workflow run for an upgrade/storage check (select its artifact name below)'
        required: false
        default: ''
      baseline_artifact_name:
        description: 'Artifact name from the signed baseline run selected above'
        required: false
        type: choice
        default: feniq-prelaunch-universal
        options: [feniq-prelaunch-universal, feniq-apk-TEST-ONLY, feniq-apk]
      api_base_url:
        description: 'رابط السيرفر (اتركه فارغاً للافتراضي)'
        required: false

# contents: write - to put the main build on the fixed "test-latest" release.
permissions:
  contents: write
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    outputs:
      artifact: ${{ steps.signing.outputs.artifact }}
    # Ammar: never create an APK automatically; wait for an explicit request.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/codex/launch-apk-validation-2026-10-31' || github.ref == 'refs/heads/codex/release-acceptance-2026-11-05')) || (github.event_name == 'pull_request' && github.head_ref == 'codex/pharmacist-launch' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phoenix
    env:
      PHARMACIST_CANDIDATE: ${{ github.head_ref == 'codex/pharmacist-launch' || github.ref == 'refs/heads/codex/pharmacist-launch' || github.ref == 'refs/heads/codex/release-acceptance-2026-11-05' }}
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://feniq-connect-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      # The app pins an NDK the runner doesn't have; Gradle installs it only
      # once the SDK licenses are accepted.
      - name: Accept Android SDK licenses
        run: bash android/install-ci-sdk.sh

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          EXPECTED_SHA256="${EXPECTED_SHA256:-$(cat ../.github/android-certificate.sha256)}"
          if [ "$PHARMACIST_CANDIDATE" = true ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The requested pharmacist acceptance build requires the permanent signing key."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in repository secrets - this APK is signed with a temporary debug key, uploaded as feniq-apk-TEST-ONLY and never published. See phoenix/android/README.md."
            echo "artifact=feniq-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A signed staging build must never replace the public production APK.
          if [ "$GITHUB_REF" = refs/heads/main ] && \
             [ "$API_BASE_URL" = 'https://feniq-connect-api.onrender.com/api' ]; then
            if [ -z "$EXPECTED_SHA256" ]; then
              echo "::error::ANDROID_CERT_SHA256 is required for production publication."
              exit 1
            fi
            echo "artifact=feniq-apk" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=feniq-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Version code = run number + 1000: this repo started counting runs at 1 when
      # it moved accounts (2026-10-11), but phones already carry builds up to ~100+
      # from the old repo, and Android refuses to install a lower version code
      # over a higher one ("App not installed").
      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=$((GITHUB_RUN_NUMBER + 1000))
          --dart-define="API_BASE_URL=$API_BASE_URL"

      # What the owner checks to know an update will install over the previous
      # version: the same application id and the same certificate fingerprint.
      - name: Verify signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ARTIFACT: ${{ steps.signing.outputs.artifact }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED_SHA256="${EXPECTED_SHA256:-$(cat ../.github/android-certificate.sha256)}"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          app_id=$("$tools/aapt2" dump packagename "$apk")
          # The signer line's label varies by apksigner version and signature
          # scheme ("Signer #1 ...", "Signer (minSdkVersion=...) ..."), so match
          # on the digest label alone and take the first.
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          cert=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -z "$cert" ]; then
            echo "$certs"
            echo "::error::Could not read the signing certificate fingerprint from apksigner."
            exit 1
          fi
          {
            echo "### APK"
            echo "- artifact: \`$ARTIFACT\`"
            echo "- applicationId: \`$app_id\`"
            echo "- signing certificate SHA-256: \`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "applicationId=$app_id"
          echo "certificate SHA-256=$cert"
          if { [ "$ARTIFACT" = "feniq-apk" ] || [ "$PHARMACIST_CANDIDATE" = true ]; } && [ -n "$EXPECTED_SHA256" ]; then
            want=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')
            got=$(echo "$cert" | tr -d ':')
            if [ "$want" != "$got" ]; then
              echo "::error::APK signed with a different key than ANDROID_CERT_SHA256 - it would NOT install over the existing app."
              exit 1
            fi
            echo "Fingerprint matches ANDROID_CERT_SHA256."
          fi
          badging=$("$tools/aapt2" dump badging "$apk")
          version_name=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          actual_build=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
          [ "$app_id" = com.feniq.link ]
          [ "$actual_build" = "$((GITHUB_RUN_NUMBER + 1000))" ]
          [ -n "$version_name" ]
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)
          jq -n --arg api "$API_BASE_URL" --arg id "$app_id" --arg cert "$cert" \
            --arg sha "$digest" --arg version "$version_name" --arg commit "$GITHUB_SHA" \
            --arg build "$((GITHUB_RUN_NUMBER + 1000))" --arg date "$(date -u +%F)" \
            '{versionName:$version, apiBaseUrl:$api, applicationId:$id, certificateSha256:$cert, sha256:$sha, commit:$commit, build:$build, date:$date}' \
            > build/app/outputs/flutter-apk/release.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            phoenix/build/app/outputs/flutter-apk/app-release.apk
            phoenix/build/app/outputs/flutter-apk/release.json
          retention-days: 30

      # One universal phone download also supports phones whose Android OS
      # runs 32-bit despite a 64-bit CPU. Reuse the already verified APK; do
      # not replace the stable phone link with an arm64-only build.
      - name: Prepare universal phone APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release == true && github.ref == 'refs/heads/main' && steps.signing.outputs.artifact == 'feniq-apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk feniq-test.apk

      # Same app for the Android Studio emulator, which runs x86_64 images and
      # cannot install the arm64-only phone build.
      - name: Build emulator APK (x86_64)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release == true && github.ref == 'refs/heads/main' && steps.signing.outputs.artifact == 'feniq-apk'
        run: |
          (cd android && ./gradlew --stop) || true
          flutter build apk --release \
            --target-platform android-x64 \
            --build-number=$((GITHUB_RUN_NUMBER + 1000)) \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk feniq-emulator.apk

      - name: Publish to the test-latest release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release == true && github.ref == 'refs/heads/main' && steps.signing.outputs.artifact == 'feniq-apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="آخر نسخة تجريبية من main (بناء رقم $((GITHUB_RUN_NUMBER + 1000))، ${GITHUB_SHA::7}). feniq-test.apk للموبايل، feniq-emulator.apk للمحاكي. احذف التطبيق القديم قبل التثبيت إذا كانت نسخة تجريبية."
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest feniq-test.apk feniq-emulator.apk --clobber
            gh release edit test-latest --notes "$notes"
          else
            gh release create test-latest feniq-test.apk feniq-emulator.apk --prerelease --title "Feniq - آخر نسخة تجريبية" --notes "$notes" --target "$GITHUB_SHA"
          fi


  upgrade-validation:
    if: always() && (github.ref == 'refs/heads/codex/launch-upgrade-check-2026-10-31' || (needs.build.result == 'success' && (github.event_name == 'push' || inputs.baseline_validation_run != '' || (github.event_name == 'pull_request' && github.head_ref == 'codex/pharmacist-launch' && github.event.pull_request.head.repo.full_name == github.repository))))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: feniq-apk*
          merge-multiple: true
          run-id: ${{ github.ref == 'refs/heads/codex/launch-upgrade-check-2026-10-31' && '40871855654' || github.run_id }}
          github-token: ${{ github.token }}
          path: apk/current
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact_name || (github.ref == 'refs/heads/codex/release-acceptance-2026-11-05' && 'feniq-apk-TEST-ONLY') || 'feniq-prelaunch-universal' }}
          run-id: ${{ inputs.baseline_validation_run || (github.ref == 'refs/heads/codex/release-acceptance-2026-11-05' && '41988191129') || '40772986713' }}
          github-token: ${{ github.token }}
          path: apk/baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify downloaded artifact layout before starting Android
        run: |
          find apk -maxdepth 8 -type f
          test "$(find apk/current -type f -name '*.apk' | wc -l)" = 1
          test "$(find apk/current -type f -name 'release.json' | wc -l)" = 1
          test "$(find apk/baseline -type f -name '*.apk' | wc -l)" = 1
      - name: Verify both signatures, versions and artifact digests before Android
        run: VERIFY_ARTIFACT_ONLY=1 bash .github/scripts/android_upgrade_check.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed upgrade and private storage on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android_upgrade_check.sh
      - name: Keep upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feniq-signed-upgrade-evidence
          path: apk/evidence/
          retention-days: 30
          if-no-files-found: warn
