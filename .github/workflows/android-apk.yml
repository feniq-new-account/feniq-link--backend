# يبني تطبيق الصيدليات (APK) تلقائياً مع كل تعديل على phoenix/ في main،
# أو يدوياً من تبويب Actions ← Build Android APK ← Run workflow.
# الملف الناتج: صفحة التشغيل ← Artifacts ← feniq-apk.
#
# التوقيع: إذا وُجدت أسرار المستودع ANDROID_KEYSTORE_BASE64 و
# ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD يُوقَّع
# بالمفتاح الدائم، وإلا بمفتاح مؤقت (للتجربة فقط — لا يُحدَّث فوقه).
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'رابط السيرفر (اتركه فارغاً للافتراضي)'
        required: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phoenix
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://feniq-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in repository secrets - signed with a temporary debug key (testing only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: feniq-apk
          path: phoenix/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
