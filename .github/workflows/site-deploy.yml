# ينشر الموقع التعريفي (site/) مع آخر نسخة APK ناجحة.
#
# يجمع site/ + app-release.apk (من آخر تشغيل ناجح لـ Build Android APK على main)
# في commit واحد ويدفعه إلى الفرع site-dist. خدمة feniq-site في render.yaml تنشر
# ذلك الفرع كما هو، فيصير التطبيق قابلاً للتنزيل من https://<الموقع>/feniq.apk.
#
# النشر يدوي فقط: Actions ← Deploy website ← Run workflow.
# إذا لم يحدد المالك رقم APK مؤهلاً، تُحفظ النسخة المنشورة حالياً.
# لا تستبدل APK الموقع نتيجة بناء Android أو دفع موقع جديد تلقائياً.
name: Deploy website

# One-off user-approved publication of verified, signed build 1143.
# Kept on this dedicated release branch only; main remains manual-only.
on:
  push:
    branches: [release/approved-site-apk-1143-20261108]
    paths: ['.github/workflows/site-deploy.yml']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Approved signed Build Android APK run ID from main; leave blank to preserve currently published APK'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release/approved-site-apk-1143-20261108')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Preserve the currently published download
        run: |
          mkdir previous
          previous_ref=$(git ls-remote --heads origin site-dist)
          if [ -n "$previous_ref" ]; then
            git fetch --depth=1 origin site-dist
            if git cat-file -e FETCH_HEAD:feniq.apk 2>/dev/null; then
              git show FETCH_HEAD:feniq.apk > previous/feniq.apk
              git show FETCH_HEAD:version.json > previous/version.json
              if git cat-file -e FETCH_HEAD:releases 2>/dev/null; then
                git archive FETCH_HEAD releases | tar -x -C previous
              fi
            fi
          fi

      - name: Validate explicitly approved signed APK run
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN_ID: ${{ github.event_name == 'push' && '42384297238' || inputs.apk_run_id }}
        run: |
          if [ -z "$APPROVED_RUN_ID" ]; then
            echo "No APK run approved: preserving the existing website download."
            exit 0
          fi
          if ! [[ "$APPROVED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::apk_run_id must be a numeric workflow run ID."
            exit 1
          fi
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN_ID" \
            --jq '[.name, .event, .head_branch, .status, .conclusion] | @tsv')
          IFS=$'\t' read -r name event branch status conclusion <<< "$metadata"
          if [ "$name" != 'Build Android APK' ] || [ "$event" != 'workflow_dispatch' ] || \
             [ "$branch" != main ] || [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo "::error::Selected run is not a successful manual main Android build."
            exit 1
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "feniq-apk" and .expired == false)] | length')
          if [ "$count" != 1 ]; then
            echo "::error::Selected run has no unexpired permanently signed feniq-apk artifact."
            exit 1
          fi
          echo "id=$APPROVED_RUN_ID" >> "$GITHUB_OUTPUT"

      # Explicitly requested artifacts must download successfully; never fall back silently.
      - name: Download APK
        if: steps.apk.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          name: feniq-apk
          run-id: ${{ steps.apk.outputs.id }}
          github-token: ${{ github.token }}
          path: apk

      - name: Assemble
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          EXPECTED_SHA256="${EXPECTED_SHA256:-$(cat .github/android-certificate.sha256)}"
          python3 .github/scripts/assemble-site.py --source site --apk apk \
            --previous previous --output dist --expected-cert "$EXPECTED_SHA256"
          cat dist/version.json

      # One orphan commit each time, force-pushed, so the APKs never pile up in history.
      - name: Publish to site-dist
        working-directory: dist
        run: |
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" site-dist
