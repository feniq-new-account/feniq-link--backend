# ينشر الموقع التعريفي (site/) مع آخر نسخة APK ناجحة.
#
# يجمع site/ + app-release.apk (من آخر تشغيل ناجح لـ Build Android APK على main)
# في commit واحد ويدفعه إلى الفرع site-dist. خدمة feniq-site في render.yaml تنشر
# ذلك الفرع كما هو، فيصير التطبيق قابلاً للتنزيل من https://<الموقع>/feniq.apk.
#
# يعمل تلقائياً: عند أي تعديل على site/ في main، وبعد كل بناء APK ناجح.
# أو يدوياً: Actions ← Deploy website ← Run workflow.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
      - '.github/scripts/assemble-site.py'
  workflow_run:
    workflows: ['Build Android APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Preserve the currently published download
        run: |
          mkdir previous
          previous_ref=$(git ls-remote --heads origin site-dist)
          if [ -n "$previous_ref" ]; then
            git fetch --depth=1 origin site-dist
            if git cat-file -e FETCH_HEAD:feniq.apk 2>/dev/null; then
              git show FETCH_HEAD:feniq.apk > previous/feniq.apk
              git show FETCH_HEAD:version.json > previous/version.json
            fi
          fi

      - name: Find the latest available signed production artifact
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-apk.yml --branch main \
                --event workflow_dispatch --status success --limit 20 --json databaseId --jq '.[].databaseId')
          for run_id in $runs; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "feniq-apk" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              echo "id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      # Artifacts expire after 30 days (android-apk.yml); a missing one is not fatal.
      - name: Download APK
        if: steps.apk.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: feniq-apk
          run-id: ${{ steps.apk.outputs.id }}
          github-token: ${{ github.token }}
          path: apk

      - name: Assemble
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          python3 .github/scripts/assemble-site.py --source site --apk apk \
            --previous previous --output dist --expected-cert "$EXPECTED_SHA256"
          cat dist/version.json

      # One orphan commit each time, force-pushed, so the APKs never pile up in history.
      - name: Publish to site-dist
        working-directory: dist
        run: |
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" site-dist
