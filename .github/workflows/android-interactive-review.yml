# Explicit, bounded UI review. No production API, signing key or nightly schedule.
name: Android interactive acceptance

on:
  push:
    branches: [codex/android-interactive-acceptance-2026-11-05]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-interactive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Install isolated review dependencies
        run: |
          python3 -m unittest discover -s .github/scripts -p test_android_interactive_review.py
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          bash phoenix/android/install-ci-sdk.sh
      - name: Prepare a debug-only localhost build without Firebase
        run: |
          python3 .github/scripts/prepare_android_ui_review.py
          cd phoenix
          flutter pub get
          flutter build apk --debug --target-platform android-x64 --build-number=1 \
            --dart-define=API_BASE_URL=http://127.0.0.1:5085/api \
            --dart-define=PANEL_URL=http://127.0.0.1:5176
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Interactive screen-by-screen review on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          FENIQ_ACCEPTANCE_OUTPUT: /tmp/feniq-android-ui-private.json
          FENIQ_UI_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            python3 .claude/skills/webapp-testing/scripts/with_server.py
            --server 'exec env -u GH_TOKEN -u GITHUB_TOKEN node backend/scripts/acceptance/server.js >/tmp/feniq-ui-api.log 2>&1' --port 5085
            --server 'cd web && exec env -u GH_TOKEN -u GITHUB_TOKEN VITE_API_BASE_URL=http://127.0.0.1:5085/api node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5176 >/tmp/feniq-ui-web.log 2>&1' --port 5176
            --timeout 120 -- python3 .github/scripts/android_interactive_review.py
