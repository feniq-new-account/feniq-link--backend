# يبني تطبيق المناديب «Feniq Rep» (APK): تطبيق منفصل عن تطبيق الصيدليات بمعرّف
# واسم وأيقونة مختلفة (com.feniq.link.rep)، فيتثبّتان جنب بعض على نفس الموبايل.
# نفس الكود: يُبنى بـ FENIQ_APP=rep (أندرويد) و --dart-define=APP_EDITION=rep (دارت).
#
# تلقائياً مع كل تعديل على phoenix/ في main، أو يدوياً من Actions ← Build Rep APK.
# الملف الناتج: صفحة التشغيل ← Artifacts ← feniq-rep-apk.
#
# للتجربة من الموبايل: كل بناء على main يضع آخر نسخة على رابط ثابت (APK مباشر):
# https://github.com/phoenixxx-dev/feniq-backend/releases/download/rep-test-latest/feniq-rep-test.apk
#
# التوقيع: نفس أسرار تطبيق الصيدليات (ANDROID_KEYSTORE_*). بدونها يُبنى بمفتاح
# مؤقت باسم feniq-rep-apk-TEST-ONLY ولا يُنشر على أي رابط ثابت إلا للتجربة من main.
#
# مستقل عن android-apk.yml عمداً: فشل بناء المناديب لا يوقف تطبيق الصيدليات ولا
# نشر الموقع، والموقع يأخذ تطبيق الصيدليات فقط (artifact اسمه feniq-apk).
name: Build Rep APK

on:
  push:
    branches: [main]
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-rep-apk.yml'
  pull_request:
    paths:
      - 'phoenix/**'
      - '.github/workflows/android-rep-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'رابط السيرفر (اتركه فارغاً للافتراضي)'
        required: false

# contents: write - to put the main build on the fixed "rep-test-latest" release.
permissions:
  contents: write

concurrency:
  group: android-rep-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phoenix
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://feniq-connect-api.onrender.com/api' }}
      # Read by android/app/build.gradle.kts: the rep app's id, name and icon.
      FENIQ_APP: rep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in repository secrets - this APK is signed with a temporary debug key, uploaded as feniq-rep-apk-TEST-ONLY. See phoenix/android/README.md."
            echo "artifact=feniq-rep-apk-TEST-ONLY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "artifact=feniq-rep-apk" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build rep APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=APP_EDITION=rep

      # The rep app must be its own app: if the id ever fell back to the
      # pharmacy app's, an install would replace it instead of sitting beside it.
      - name: Verify it is a separate app
        env:
          ARTIFACT: ${{ steps.signing.outputs.artifact }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          app_id=$("$tools/aapt2" dump packagename "$apk")
          label=$("$tools/aapt2" dump badging "$apk" | sed -n "s/^application-label:'\(.*\)'$/\1/p" | head -1)
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          cert=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          {
            echo "### Rep APK"
            echo "- artifact: \`$ARTIFACT\`"
            echo "- applicationId: \`$app_id\`"
            echo "- app name: \`$label\`"
            echo "- signing certificate SHA-256: \`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "applicationId=$app_id label=$label"
          if [ "$app_id" != "com.feniq.link.rep" ]; then
            echo "::error::The rep APK has application id '$app_id', expected com.feniq.link.rep."
            exit 1
          fi
          if [ -n "$label" ] && [ "$label" != "Feniq Rep" ]; then
            echo "::error::The rep APK is named '$label', expected 'Feniq Rep'."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: phoenix/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # The fixed download link for trying the rep app on a phone (a release
      # asset is served straight as an .apk, no zip). 64-bit ARM only. main
      # only - neither a PR nor a manual run of another branch replaces it.
      - name: Build phone APK (arm64)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=APP_EDITION=rep

      - name: Publish to the rep-test-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk feniq-rep-test.apk
          notes="آخر نسخة تجريبية من تطبيق المناديب «Feniq Rep» من main (بناء رقم ${{ github.run_number }}، ${GITHUB_SHA::7}). تطبيق منفصل عن تطبيق الصيدليات ويتثبّت جنبه."
          if gh release view rep-test-latest >/dev/null 2>&1; then
            gh release upload rep-test-latest feniq-rep-test.apk --clobber
            gh release edit rep-test-latest --notes "$notes"
          else
            gh release create rep-test-latest feniq-rep-test.apk --prerelease --title "Feniq Rep - آخر نسخة تجريبية" --notes "$notes" --target "$GITHUB_SHA"
          fi
