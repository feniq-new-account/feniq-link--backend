name: Accountant Android smoke APK (isolated)
on:
  push:
    branches:
      - build/accountant-smoke-apk-20261106
    paths:
      - '.github/workflows/accountant-smoke-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Accept Android SDK licenses
        run: bash android/install-ci-sdk.sh
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Test Flutter
        run: flutter test
      - name: Build non-public debug APK
        run: >
          flutter build apk --debug --target-platform android-arm64
          --dart-define=API_BASE_URL=https://feniq-connect-api.onrender.com/api
          --dart-define=PANEL_URL=https://feniq-connect-web.onrender.com
      - name: Upload private debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: feniq-pharmacist-smoke-arm64-debug
          path: phoenix/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
