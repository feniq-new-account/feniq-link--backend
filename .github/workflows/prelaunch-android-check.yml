# Validation requested for this prelaunch review only. Never publishes to the
# site or a release, and never exposes the signing key outside GitHub Actions.
name: Prelaunch Android validation
on:
  push:
    branches: [codex/prelaunch-hardening]
    paths:
      - 'phoenix/**'
      - '.github/workflows/prelaunch-android-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prelaunch-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: phoenix
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://feniq-connect-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android SDK and NDK licenses
        run: bash android/install-ci-sdk.sh
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - name: Configure existing signing credential
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'kind=TEST-ONLY' >> "$GITHUB_OUTPUT"
            echo '::warning::No production signing credential configured; validation APK uses a temporary test key.'
            exit 0
          fi
          [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo '::error::Incomplete signing configuration.'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo 'storeFile=upload-keystore.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo 'kind=signed' >> "$GITHUB_OUTPUT"
      - name: Compile ARM64 release APK
        run: >
          flutter build apk --release --target-platform android-arm64 --no-pub
          --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Verify Android artifact
        env:
          KIND: ${{ steps.signing.outputs.kind }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          app_id=$("$tools/aapt2" dump packagename "$apk")
          [ "$app_id" = 'com.feniq.link' ] || { echo '::error::Unexpected Android application ID.'; exit 1; }
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F')
          [ -n "$cert" ] || { echo '::error::Missing signing certificate.'; exit 1; }
          # Keep pubspec's version code for this isolated validation artifact;
          # never mint a high code that could block later production updates.
          verification=TEST-ONLY
          if [ "$KIND" = signed ]; then
            if [ -n "$EXPECTED_SHA256" ]; then
              expected=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')
              [ "$expected" = "$cert" ] || { echo '::error::Signing certificate does not match the configured production fingerprint.'; exit 1; }
              verification=signed-fingerprint-verified
            else
              verification=signed-fingerprint-not-configured
              echo '::warning::APK is signed, but production fingerprint is not configured; update compatibility is unverified.'
            fi
          fi
          mkdir -p build/prelaunch
          cp "$apk" build/prelaunch/feniq-prelaunch-arm64.apk
          sha256sum build/prelaunch/feniq-prelaunch-arm64.apk > build/prelaunch/SHA256SUMS
          jq -n --arg verification "$verification" --arg cert "$cert" --arg api "$API_BASE_URL" \
            --arg commit "$GITHUB_SHA" --arg id "$app_id" \
            '{verification:$verification,certificateSha256:$cert,apiBaseUrl:$api,commit:$commit,applicationId:$id,publication:false}' > build/prelaunch/validation.json
          { echo '### Android prelaunch validation'; echo "- $verification"; echo "- applicationId: $app_id"; echo "- Commit: $GITHUB_SHA"; echo '- Review artifact only; no website publication.'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: feniq-prelaunch-arm64
          path: phoenix/build/prelaunch/
          retention-days: 7
          if-no-files-found: error
