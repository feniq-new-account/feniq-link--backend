name: Apply recovered settlement controls (isolated)
on:
  push:
    branches: [fix/collection-operator-controls-20261106]
    paths:
      - '.github/handoffs/collection-controls-20261106.patch'
      - '.github/workflows/apply-collection-controls.yml'
permissions:
  contents: write
concurrency:
  group: apply-collection-controls-20261106
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify exact handoff content
        run: |
          echo '9c8f2921e100d6016c19ae6c20c1a37e2840bac4b62e4aa3af951278a1dcfb57  .github/handoffs/collection-controls-20261106.patch' | sha256sum -c -
      - name: Apply recovered code without resetting any files
        run: |
          git apply --check .github/handoffs/collection-controls-20261106.patch
          git apply --index .github/handoffs/collection-controls-20261106.patch
          git diff --cached --check
          node --check backend/src/services/collectionAccountingRead.service.js
          node --check backend/src/services/collectionSettlementCandidates.service.js
      - name: Install web dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Targeted React tests
        working-directory: web
        run: npx vitest run src/components/AdminCollectionControls.test.jsx src/pages/AdminCommissionCash.test.jsx
      - name: Verify React production build
        working-directory: web
        run: npx vite build
      - name: Publish validated recovered changes to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(accounting): operator controls and safe retry for collection settlements'
          git push origin "HEAD:$GITHUB_REF_NAME"
