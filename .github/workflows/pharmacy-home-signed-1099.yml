# Signed test build of the compact pharmacist home UI; never publish automatically.
name: Feniq pharmacy home APK 1099 - no publication
on:
  push:
    branches: [build/pharmacy-home-signed-1099-20261107]
    paths: ['.github/workflows/pharmacy-home-signed-1099.yml']
permissions:
  contents: read
jobs:
  signed-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Android SDK licenses
        run: bash android/install-ci-sdk.sh
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter tests
        run: flutter test
      - name: Prepare permanent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for item in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!item:-}" ]; then
              echo "::error::Missing permanent Android signing configuration: $item"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-keystore.jks
      - name: Build phone APK with permanent key
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-number=1099
          --dart-define=API_BASE_URL=https://feniq-connect-api.onrender.com/api
      - name: Verify expected original app signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --verbose "$apk" >/dev/null
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ' :\r' | tr 'a-f' 'A-F')
          expected=$(tr -d ' :\r\n' < ../.github/android-certificate.sha256 | tr 'a-f' 'A-F')
          if [ -z "$cert" ] || [ "$cert" != "$expected" ]; then
            echo "::error::Staging signature does not match existing app. Blocking artifact."
            exit 1
          fi
          appid=$("$tools/aapt2" dump packagename "$apk")
          [ "$appid" = com.feniq.link ]
          "$tools/aapt2" dump badging "$apk" | grep -q "versionCode='1099'"
          sha256sum "$apk" > build/app/outputs/flutter-apk/sha256.txt
          echo "Original app signing certificate verified; package is $appid; versionCode=1099"
          echo "No deployment or release publication has occurred."
      - name: Remove signing keys from runner
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
      - name: Upload non-public permanent-signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: feniq-pharmacy-home-1099-arm64
          path: |
            phoenix/build/app/outputs/flutter-apk/app-release.apk
            phoenix/build/app/outputs/flutter-apk/sha256.txt
          if-no-files-found: error
          retention-days: 7
