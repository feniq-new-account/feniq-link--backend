name: feniq
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  dio: ^5.10.0
  go_router: ^17.2.3
  connectivity_plus: ^7.3.0
  logger: ^2.7.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.0
  # 12.x resolves permission_handler_android 13.x (AGP 8 / Groovy build). 13.x
  # pulls permission_handler_android 14, which requires AGP 9 + Kotlin 2.3 and
  # does not build on this Flutter/AGP toolchain.
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  file: ^7.0.1
  # Autoplay video banners in the Offers/Ads slider (BannerSlider) - the only
  # video content in the app.
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geolocator_android: ^4.6.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2
  flutter_lints: ^5.0.0
  mocktail:
  bloc_test:
  firebase_remote_config: ^6.6.0
  package_info_plus: ^9.0.1
  # Order submission idempotency (Money-Flow V2): CartCubit mints a v4 UUID
  # per submit attempt so a retried POST /orders returns the order the first
  # attempt created instead of placing a second billable one. Already resolved
  # transitively before this - promoted to a direct dependency because we now
  # import it ourselves.
  uuid: ^4.6.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  # Payments by voice (warehouse accounts): Android's own recognizer, free.
  speech_to_text: ^7.0.0
  # 3.3.x: newer lottie needs Dart 3.11, CI builds on Flutter 3.35 (Dart 3.9).
  lottie: ">=3.3.3 <3.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  

# Launcher icons (3D bird, 2026-10-12) are generated by this package:
#   dart run flutter_launcher_icons
# feniq_icon_source.png is the full square icon (old Android + iOS);
# feniq_icon_fg/bg.png are the Android 8+ adaptive layers (bird inside the
# 66% safe zone, so circle/squircle masks never cut it).
# assets/branding/generate_assets.py still emits the old flat icon - don't
# rerun its icon step or it overwrites feniq_icon_source.png.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/feniq_icon_source.png"
  adaptive_icon_background: "assets/images/feniq_icon_bg.png"
  adaptive_icon_foreground: "assets/images/feniq_icon_fg.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # Splash intro (Lottie, from Claude Design; sparks and its own background
    # removed - SplashView paints the background).
    - assets/animations/

  # Same two faces as the FENIQ website, so app and site read as one brand
  # (SIL OFL, see assets/fonts/OFL-*.txt). Readex Pro carries titles, buttons,
  # labels and prices; IBM Plex Sans Arabic carries reading text. Static
  # instances subset to Arabic + Latin, bundled rather than fetched at runtime.
  fonts:
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
