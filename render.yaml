# فينيق — نشر على Render من Blueprint (ضغطة واحدة).
# Render → New → Blueprint → اختر هذا الريبو.
#
# الأسرار المعلَّمة sync: false تُطلب منك مرة واحدة عند الإنشاء ولا تُكتب هنا.
# JWT_SECRET يولّده Render تلقائياً: لا أحد يراه، ولا حاجة لنسخه.
#
# قاعدة البيانات ليست هنا: Render لا يستضيف MongoDB. استعمل MongoDB Atlas
# (المجاني يكفي، وهو replica set فيدعم المعاملات التي يشترطها السيرفر).
services:
  # السيرفر (Node/Express) — التطبيق واللوحة كلاهما يتكلّم معه.
  - type: web
    name: feniq-connect-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # رابط لوحة الويب — بدونه يرفض المتصفح طلباتها (CORS).
      - key: CORS_ORIGINS
        value: https://feniq-connect-web.onrender.com
      # console = لا يوجد مزوّد SMS بعد. بالإنتاج الرمز لا يُكتب في السجلات؛
      # استرجاع كلمة السر من لوحة الأدمن (الحسابات ← إعادة تعيين كلمة السر).
      - key: SMS_PROVIDER
        value: console
      # الإشعارات (اختياري — بدونها تتعطّل الإشعارات فقط).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # الصور (اختياري — بدونها يتعطّل رفع الصور فقط).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # لوحة الويب (React/Vite) — للأدمن والمستودعات.
  - type: web
    name: feniq-connect-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://feniq-connect-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # الموقع التعريفي العام (site/) + ملف التطبيق feniq.apk.
  # لا يُبنى هنا: الفرع site-dist يجهّزه .github/workflows/site-deploy.yml كاملاً.
  - type: web
    name: feniq-site
    runtime: static
    branch: site-dist
    buildCommand: echo "prebuilt by site-deploy.yml"
    staticPublishPath: .
    headers:
      - path: /feniq.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /feniq.apk
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
