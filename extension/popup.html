<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لاقط الطلبيات</title>
<link rel="stylesheet" href="src/pages.css">
<style>
body{width:340px;background:var(--paper)}
.hd{background:var(--navy);color:#fff;padding:16px 16px 18px;display:flex;align-items:center;gap:12px}
.hd img{width:34px;height:41px;object-fit:contain}
.hd strong{display:block;font-size:17px;font-weight:700}
.hd span{font-size:12.5px;color:var(--on-dark)}
main{padding:16px;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:#fff}
.week div{padding:10px 12px;display:flex;flex-direction:column}
.week div+div{border-inline-start:1px solid var(--line)}
.week b{font-size:19px;font-weight:800}
.week span{font-size:11.5px;color:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.row a{font-weight:600}
#msg:empty{display:none}
</style>
</head>
<body>
  <header class="hd">
    <img src="assets/mark-dark.png" alt="فينيق">
    <div><strong>لاقط الطلبيات</strong><span id="cat">…</span></div>
  </header>
  <main>
    <button class="btn pri" id="open">افتح اللاقط على هالصفحة</button>
    <p class="msg" id="msg" role="status"></p>
    <section class="week" aria-label="هالأسبوع">
      <div><b class="num" id="w-orders">0</b><span>طلبية هالأسبوع</span></div>
      <div><b class="num" id="w-pharm">0</b><span>صيدلية</span></div>
      <div><b class="num" id="w-total">0</b><span>ل.س</span></div>
    </section>
    <div class="row"><span>اختصار: <span dir="ltr"><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd></span></span><a href="#" id="settings">الإعدادات والسجل</a></div>
  </main>
  <script src="src/popup.js"></script>
</body>
</html>
